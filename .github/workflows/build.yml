name: Compile and Publish PDF
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: lisianskaia.tex

      - name: Commit PDF
        run: |
          cp lisianskaia.pdf lisianskaia-resume.pdf
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add lisianskaia-resume.pdf
          git commit -m "Update PDF" || echo "No changes"
          git push origin main
